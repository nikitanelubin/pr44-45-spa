[domashniy-hleb.local]

; Open Server запускает сервер Express командой app_start_command
; и передаёт ему все запросы к домену (backend_enabled = on) на порт backend_port.
; Порт должен совпадать с PORT в файле server\.env.
; Сервер отдаёт и API, и собранный клиент Vue (client\dist)
app_start_command = node server\index.js
backend_enabled   = on
backend_ip        = 127.0.0.1
backend_port      = 3004
http_engine       = Nginx
node_engine       = Node-22.23.4
tls_enabled       = off
web_root          = {base_dir}
